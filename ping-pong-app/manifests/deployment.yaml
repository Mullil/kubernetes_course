apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong-app
  template:
    metadata:
      labels:
        app: ping-pong-app
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: log-claim
      containers:
        - name: ping-pong-app
          image: mullil/ping-pong-app:1.11
          volumeMounts:
            - name: shared-image
              mountPath: /app/files