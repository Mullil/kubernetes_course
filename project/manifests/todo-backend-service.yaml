apiVersion: v1
kind: Service
metadata:
  name: todo-backend-svc
  namespace: project
  annotations:
    cloud.google.com/backend-config: '{"default": "project-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: todo-backend
  ports:
    - port: 3001
      protocol: TCP
      targetPort: 3001